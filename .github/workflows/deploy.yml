name: Deploy React/Vite App to GitHub Pages

on:
  push:
    branches: ["main"] # ganti master kalau branch utama lu namanya master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json' # mengacu ke folder web

      - name: Install dependencies
        run: npm ci
        working-directory: ./web # nge-run npm ci di dalam folder web

      - name: Build project
        run: npm run build
        working-directory: ./web # nge-run npm run build di dalam folder web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist' # folder hasil build Vite (ganti ./web/build kalau pake CRA)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
